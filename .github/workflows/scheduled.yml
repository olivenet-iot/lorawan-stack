# =============================================================================
# Olivenet TTS - Scheduled Tasks
# =============================================================================
# Runs on schedule for maintenance and security scanning
# =============================================================================

name: Scheduled Tasks

on:
  schedule:
    # Security scan - Every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
    # Backup verification - Every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        type: choice
        options:
          - security-scan
          - backup-verify
          - all

jobs:
  # ===========================================================================
  # Determine which tasks to run
  # ===========================================================================
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      run-security: ${{ steps.determine.outputs.run-security }}
      run-backup: ${{ steps.determine.outputs.run-backup }}
    steps:
      - name: Determine tasks
        id: determine
        run: |
          # Manual trigger
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TASK="${{ inputs.task }}"
            if [[ "$TASK" == "security-scan" || "$TASK" == "all" ]]; then
              echo "run-security=true" >> $GITHUB_OUTPUT
            else
              echo "run-security=false" >> $GITHUB_OUTPUT
            fi
            if [[ "$TASK" == "backup-verify" || "$TASK" == "all" ]]; then
              echo "run-backup=true" >> $GITHUB_OUTPUT
            else
              echo "run-backup=false" >> $GITHUB_OUTPUT
            fi
          else
            # Scheduled trigger - determine by cron time
            HOUR=$(date -u +%H)
            DAY=$(date -u +%u)  # 1=Monday, 7=Sunday

            # 00:00 on Sunday = security scan
            if [[ "$HOUR" == "00" && "$DAY" == "7" ]]; then
              echo "run-security=true" >> $GITHUB_OUTPUT
              echo "run-backup=false" >> $GITHUB_OUTPUT
            # 06:00 daily = backup verify
            elif [[ "$HOUR" == "06" ]]; then
              echo "run-security=false" >> $GITHUB_OUTPUT
              echo "run-backup=true" >> $GITHUB_OUTPUT
            else
              echo "run-security=false" >> $GITHUB_OUTPUT
              echo "run-backup=false" >> $GITHUB_OUTPUT
            fi
          fi

  # ===========================================================================
  # Security Scan (Weekly)
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.run-security == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run govulncheck
        id: govuln
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... 2>&1 | tee vuln-report.txt || true

          # Count vulnerabilities
          VULN_COUNT=$(grep -c "Vulnerability" vuln-report.txt || echo "0")
          echo "vuln-count=$VULN_COUNT" >> $GITHUB_OUTPUT

      - name: Run Trivy on codebase
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Build Docker image
        run: docker build -t olivenet/lorawan-stack:scan .

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'olivenet/lorawan-stack:scan'
          format: 'table'
          output: 'trivy-image-report.txt'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Check for critical vulnerabilities
        id: check
        run: |
          CRITICAL=0
          HIGH=0

          # Count from Trivy reports
          if [[ -f trivy-fs-report.txt ]]; then
            CRITICAL=$((CRITICAL + $(grep -c "CRITICAL" trivy-fs-report.txt || echo "0")))
            HIGH=$((HIGH + $(grep -c "HIGH" trivy-fs-report.txt || echo "0")))
          fi

          if [[ -f trivy-image-report.txt ]]; then
            CRITICAL=$((CRITICAL + $(grep -c "CRITICAL" trivy-image-report.txt || echo "0")))
            HIGH=$((HIGH + $(grep -c "HIGH" trivy-image-report.txt || echo "0")))
          fi

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT

          if [[ $CRITICAL -gt 0 ]]; then
            echo "status=critical" >> $GITHUB_OUTPUT
          elif [[ $HIGH -gt 0 ]]; then
            echo "status=warning" >> $GITHUB_OUTPUT
          else
            echo "status=clean" >> $GITHUB_OUTPUT
          fi

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            vuln-report.txt
            trivy-fs-report.txt
            trivy-image-report.txt
          retention-days: 30

      - name: Create summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Security Scan Results

          | Severity | Count |
          |----------|-------|
          | Critical | ${{ steps.check.outputs.critical }} |
          | High | ${{ steps.check.outputs.high }} |
          | Go Vulns | ${{ steps.govuln.outputs.vuln-count }} |

          **Status**: ${{ steps.check.outputs.status == 'clean' && '✅ Clean' || steps.check.outputs.status == 'warning' && '⚠️ Warnings' || '❌ Critical' }}

          See uploaded artifacts for detailed reports.
          EOF

      - name: Notify on critical
        if: steps.check.outputs.status == 'critical' && secrets.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="🚨 <b>Security Alert</b>

          Critical vulnerabilities found in TTS codebase!

          Critical: ${{ steps.check.outputs.critical }}
          High: ${{ steps.check.outputs.high }}

          <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Report</a>" || true

  # ===========================================================================
  # Backup Verification (Daily)
  # ===========================================================================
  backup-verify:
    name: Backup Verification
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.run-backup == 'true'
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Check backup exists
        id: check-backup
        run: |
          if [[ -z "${{ secrets.DEPLOY_HOST }}" ]]; then
            echo "No deploy host configured, skipping"
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check for recent backup
          RESULT=$(ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "ls -la /var/backups/olivenet-tts/.latest 2>/dev/null && \
             stat -c %Y /var/backups/olivenet-tts/.latest 2>/dev/null" 2>&1) || {
            echo "status=missing" >> $GITHUB_OUTPUT
            echo "message=Could not find backup symlink" >> $GITHUB_OUTPUT
            exit 0
          }

          # Parse result
          BACKUP_TIME=$(echo "$RESULT" | tail -1)
          CURRENT_TIME=$(date +%s)
          AGE_HOURS=$(( (CURRENT_TIME - BACKUP_TIME) / 3600 ))

          echo "age-hours=$AGE_HOURS" >> $GITHUB_OUTPUT

          if [[ $AGE_HOURS -gt 48 ]]; then
            echo "status=stale" >> $GITHUB_OUTPUT
            echo "message=Backup is $AGE_HOURS hours old" >> $GITHUB_OUTPUT
          else
            echo "status=ok" >> $GITHUB_OUTPUT
            echo "message=Backup is $AGE_HOURS hours old" >> $GITHUB_OUTPUT
          fi

      - name: Check backup integrity
        if: steps.check-backup.outputs.status == 'ok'
        id: integrity
        run: |
          RESULT=$(ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "BACKUP=\$(readlink /var/backups/olivenet-tts/.latest) && \
             tar -tzf \$BACKUP > /dev/null 2>&1 && echo 'valid' || echo 'corrupt'") || {
            echo "status=unknown" >> $GITHUB_OUTPUT
            exit 0
          }

          echo "status=$RESULT" >> $GITHUB_OUTPUT

      - name: Create summary
        run: |
          STATUS="${{ steps.check-backup.outputs.status }}"
          INTEGRITY="${{ steps.integrity.outputs.status }}"

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Backup Verification

          | Check | Result |
          |-------|--------|
          | Backup Exists | ${{ steps.check-backup.outputs.status == 'ok' && '✅' || steps.check-backup.outputs.status == 'skipped' && '⏭️' || '❌' }} |
          | Age | ${{ steps.check-backup.outputs.age-hours || 'N/A' }} hours |
          | Integrity | ${{ steps.integrity.outputs.status == 'valid' && '✅ Valid' || steps.integrity.outputs.status == 'corrupt' && '❌ Corrupt' || '⏭️ Skipped' }} |

          ${{ steps.check-backup.outputs.message }}
          EOF

      - name: Notify on failure
        if: (steps.check-backup.outputs.status == 'missing' || steps.check-backup.outputs.status == 'stale' || steps.integrity.outputs.status == 'corrupt') && secrets.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="⚠️ <b>Backup Alert</b>

          Issue with TTS backup on ${{ secrets.DEPLOY_HOST }}

          Status: ${{ steps.check-backup.outputs.status }}
          ${{ steps.check-backup.outputs.message }}
          Integrity: ${{ steps.integrity.outputs.status || 'not checked' }}

          Please investigate!" || true
