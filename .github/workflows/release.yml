# =============================================================================
# Olivenet TTS - Release Management
# =============================================================================
# Handles release creation and production deployment
# Trigger: Release publish
# =============================================================================

name: Release

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Build Release
  # ===========================================================================
  build:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build binaries
        run: |
          VERSION=${{ steps.version.outputs.version }}
          LDFLAGS="-X main.Version=$VERSION -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ttn-lw-stack-linux-amd64 ./cmd/ttn-lw-stack
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/ttn-lw-stack-linux-arm64 ./cmd/ttn-lw-stack
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ttn-lw-cli-linux-amd64 ./cmd/ttn-lw-cli
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/ttn-lw-cli-linux-arm64 ./cmd/ttn-lw-cli

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/ttn-lw-stack-linux-amd64
            dist/ttn-lw-stack-linux-arm64
            dist/ttn-lw-cli-linux-amd64
            dist/ttn-lw-cli-linux-arm64

  # ===========================================================================
  # Generate Changelog
  # ===========================================================================
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          if [[ -n "$PREV_TAG" ]]; then
            echo "Generating changelog from $PREV_TAG to ${{ github.ref_name }}"

            # Generate changelog
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)

            # Count changes
            FEATURES=$(echo "$CHANGELOG" | grep -c "feat:" || echo "0")
            FIXES=$(echo "$CHANGELOG" | grep -c "fix:" || echo "0")
            DOCS=$(echo "$CHANGELOG" | grep -c "docs:" || echo "0")

            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "## Changes since $PREV_TAG" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "- $FEATURES new features" >> $GITHUB_OUTPUT
            echo "- $FIXES bug fixes" >> $GITHUB_OUTPUT
            echo "- $DOCS documentation updates" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "### Commits" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          fi

      - name: Update release notes
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## Release ${{ needs.build.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}

            ### Docker Image

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}
            ```

            ### Deployment

            See [Deployment Guide](docs/olivenet/DEPLOYMENT.md) for instructions.

  # ===========================================================================
  # Deploy to Production
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, changelog]
    environment: production
    steps:
      - name: Trigger deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: '${{ github.ref }}',
              inputs: {
                environment: 'production',
                skip_backup: 'false',
                skip_tests: 'false'
              }
            });

  # ===========================================================================
  # Notify
  # ===========================================================================
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [build, deploy-production]
    if: always()
    steps:
      - name: Send Telegram notification
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          STATUS="✅ Released"
          if [[ "${{ needs.deploy-production.result }}" == "failure" ]]; then
            STATUS="⚠️ Released (deploy pending)"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="🚀 <b>New TTS Release</b>

          Version: <code>${{ needs.build.outputs.version }}</code>
          Status: $STATUS

          <a href=\"${{ github.event.release.html_url }}\">View Release</a>" || true
