# =============================================================================
# Scenario: Stress Test - 5000 Devices
# =============================================================================
# Purpose: Full stress test simulating production load
#
# Usage:
#   python traffic_generator.py --scenario scenarios/stress_test.yml
#
# Requirements:
#   - Sufficient system resources (8GB+ RAM recommended)
#   - Network capacity for 500 uplinks/second
#   - TTS properly configured for high load

name: "Stress Test - 5000 Devices"
description: "5000 device simülasyonu - Production yük testi"

device_count: 5000

device_template:
  dev_eui_start: "70B3D57ED0010000"
  join_eui: "0000000000000000"
  # Her device için key auto-generate edilebilir
  app_key_generator: "sequential"  # Alternatif: "random"
  activation: "OTAA"

# Birden fazla gateway ile yük dağıtımı
gateways:
  - eui: "AA555A0000000001"
    weight: 50  # % of traffic
  - eui: "AA555A0000000002"
    weight: 50

test:
  # Phase 1: Join
  join_batch_size: 100       # 100'er 100'er join et
  join_batch_delay: 5        # Batch arası bekleme (saniye)
  join_timeout: 30           # Per-device timeout
  join_retry_count: 2

  # Phase 2: Traffic
  duration: 600              # 10 dakika
  uplink_rate: 500           # 500 uplink/saniye (toplamda)
  payload_size: 20           # bytes
  confirmed_ratio: 0.05      # 5% confirmed

  # Rate limiting
  max_concurrent_uplinks: 100

# Resource hints
resources:
  estimated_memory_mb: 2000  # ~400 bytes per device state
  estimated_bandwidth_mbps: 5

assertions:
  - min_join_success_rate: 0.98
  - min_uplink_success_rate: 0.99
  - max_p99_latency_ms: 5000
  - max_error_rate: 0.01

output:
  format: "json"
  file: "results/stress_test_{{timestamp}}.json"
  include_per_device_stats: false  # Too much data
