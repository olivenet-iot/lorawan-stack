# =============================================================================
# Scenario: Join Storm Test
# =============================================================================
# Purpose: Stress test join server with 100 simultaneous join requests
#
# Usage:
#   python traffic_generator.py --scenario scenarios/join_storm.yml

name: "Join Storm Test"
description: "100 device aynı anda join request - Join Server stress test"

# Device count (auto-generated DevEUIs)
device_count: 100

# Device template (used for all devices)
device_template:
  dev_eui_start: "70B3D57ED0001000"  # Auto-increment from here
  join_eui: "0000000000000000"
  app_key: "00112233445566778899AABBCCDDEEFF"
  activation: "OTAA"

gateway:
  eui: "AA555A0000000001"

test:
  # Join phase
  parallel_joins: 100        # All at once
  join_timeout: 30           # Longer timeout for stress
  join_retry_count: 3

  # No traffic phase for this test
  duration: 0

assertions:
  - min_join_success_rate: 0.95  # 95% must succeed
  - max_avg_join_time_ms: 10000  # Average < 10s

output:
  format: "json"
  file: "results/join_storm_{{timestamp}}.json"
