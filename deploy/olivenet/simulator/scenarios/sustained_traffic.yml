# =============================================================================
# Scenario: Sustained Traffic Test
# =============================================================================
# Purpose: Test continuous uplink traffic over extended period
#
# Usage:
#   python traffic_generator.py --scenario scenarios/sustained_traffic.yml

name: "Sustained Traffic Test"
description: "50 device, 5 dakika sürekli uplink traffic"

device_count: 50

device_template:
  dev_eui_start: "70B3D57ED0002000"
  join_eui: "0000000000000000"
  app_key: "00112233445566778899AABBCCDDEEFF"
  activation: "OTAA"

gateway:
  eui: "AA555A0000000001"

test:
  # Phase 1: Join
  join_batch_size: 25        # 25'er 25'er join
  join_batch_delay: 3        # Batch arası bekleme (saniye)
  join_timeout: 20

  # Phase 2: Traffic
  duration: 300              # 5 dakika
  uplink_rate: 10            # 10 uplink/saniye (toplamda)
  payload_size: 20           # bytes
  confirmed_ratio: 0.1       # 10% confirmed uplinks

assertions:
  - min_join_success_rate: 0.98
  - min_uplink_delivery_rate: 0.99
  - max_p95_latency_ms: 3000

output:
  format: "json"
  file: "results/sustained_traffic_{{timestamp}}.json"
