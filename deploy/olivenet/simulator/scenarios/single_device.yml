# =============================================================================
# Scenario: Single Device Test
# =============================================================================
# Purpose: Basic OTAA join and uplink test with a single device
#
# Usage:
#   python device_simulator.py --scenario scenarios/single_device.yml

name: "Single Device Test"
description: "Tek device OTAA join ve 5 uplink testi"

# Device configuration
devices:
  - dev_eui: "70B3D57ED0000001"
    join_eui: "0000000000000000"
    app_key: "00112233445566778899AABBCCDDEEFF"
    activation: "OTAA"

# Gateway to use
gateway:
  eui: "AA555A0000000001"

# Test parameters
test:
  join_timeout: 10           # Seconds to wait for Join Accept
  uplink_count: 5            # Number of uplinks to send
  uplink_interval: 10        # Seconds between uplinks
  payload_generator: "counter"  # counter, random, static

# Expected results (for validation)
assertions:
  - join_success: true
  - all_uplinks_received: true
  - max_latency_ms: 5000
