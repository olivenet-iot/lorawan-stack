# Olivenet The Things Stack - Production Docker Compose
# For 3000+ energy meter deployment

services:
  # ==========================================================================
  # PostgreSQL Database (Identity Server)
  # ==========================================================================
  postgres:
    image: postgres:14-alpine
    container_name: olivenet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.7"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_min_duration_statement=1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  # ==========================================================================
  # Redis (Cache, Sessions, Task Queue)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: olivenet-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --timeout 0
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli --no-auth-warning PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  # ==========================================================================
  # The Things Stack
  # ==========================================================================
  stack:
    image: thethingsnetwork/lorawan-stack:3.35
    container_name: olivenet-stack
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ttn-lw-stack -c /config/ttn-lw-stack.yml
    command: start
    environment:
      # Database
      TTN_LW_IS_DATABASE_URI: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"

      # Redis
      TTN_LW_REDIS_ADDRESS: "redis:6379"
      TTN_LW_REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Domain
      TTN_LW_TLS_ACME_DEFAULT_HOST: ${DOMAIN}
      TTN_LW_TLS_ACME_EMAIL: ${ACME_EMAIL}

      # Blob storage
      TTN_LW_BLOB_LOCAL_DIRECTORY: /srv/ttn-lorawan/public/blob

      # Secrets (override config file)
      TTN_LW_CONSOLE_OAUTH_CLIENT_SECRET: ${CONSOLE_OAUTH_CLIENT_SECRET}
      TTN_LW_DCS_OAUTH_CLIENT_SECRET: ${DEVICE_CLAIMING_SECRET}

      # Logging
      TTN_LW_LOG_LEVEL: ${LOG_LEVEL:-info}
      TTN_LW_LOG_FORMAT: ${LOG_FORMAT:-json}

    volumes:
      # Configuration
      - ./config/ttn-lw-stack.yml:/config/ttn-lw-stack.yml:ro

      # Blob storage
      - blob_data:/srv/ttn-lorawan/public/blob

      # ACME certificates (Let's Encrypt)
      - ./acme:/var/lib/acme

      # Custom certificates (if using file-based TLS)
      # - ./certs/cert.pem:/run/secrets/cert.pem:ro
      # - ./certs/key.pem:/run/secrets/key.pem:ro
      # - ./certs/ca.pem:/run/secrets/ca.pem:ro

    networks:
      - internal
      - external
    ports:
      # HTTP (ACME challenge only, redirect to HTTPS)
      - "${HTTP_PORT:-80}:1885"

      # HTTPS (Console, API, OAuth)
      - "${HTTPS_PORT:-443}:8885"

      # UDP Packet Forwarder (Gateway)
      - "${GS_UDP_PORT:-1700}:1700/udp"

      # GS MQTT (Gateway connections)
      - "1882:1882"
      - "8882:8882"

      # AS MQTT (Application data integration)
      - "1883:1883"
      - "8883:8883"

      # BasicStation WebSocket
      - "${GS_BASICSTATION_PORT:-8887}:8887"

      # GS MQTT v2 (Legacy gateway support)
      - "1881:1881"
      - "8881:8881"

      # Gateway Server gRPC (internal, expose if needed)
      # - "8884:8884"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1885/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: ${STACK_MEMORY_LIMIT:-4g}
        reservations:
          memory: 1g

# =============================================================================
# Networks
# =============================================================================
networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  blob_data:
    driver: local
